# Once a day, asks the live app to send the 30-day reminder emails that are
# due. Free hosts put the app to sleep when nobody visits, so its own timer
# cannot be relied on; this call also wakes it up.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL      the app's address, for example https://idea-check.onrender.com
#   CRON_SECRET  the same value as the app's CRON_SECRET setting
name: Daily reminder emails

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app to send due reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set yet, so there is nothing to call."
            exit 0
          fi
          # The first try can take a minute while the app wakes up.
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
