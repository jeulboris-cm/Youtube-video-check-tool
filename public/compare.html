<!doctype html>
<html lang="en" data-i18n-title="compare.page_title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Compare my ideas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">Idea Check</span>
    </a>
    <div class="header-actions">
      <a class="header-link" href="/" data-i18n="nav.check_another">Check another idea</a>
    </div>
  </header>
  <main class="container report">
    <h1 data-i18n="compare.title">Compare my ideas</h1>
    <p class="hint" data-i18n="compare.intro"></p>
    <p id="status" role="status" data-i18n="compare.loading">Loading…</p>
    <p class="error" id="error"></p>
    <p class="hint" id="basis"></p>
    <ol id="rows" class="compare"></ol>
    <form id="add-form" novalidate>
      <div class="field">
        <label for="add-link" data-i18n="compare.add_label">Add a report link</label>
        <div class="row">
          <input id="add-link" type="url" inputmode="url" placeholder="https://…/report.html?id=…">
          <button type="submit" class="secondary" data-i18n="compare.add">Add</button>
        </div>
        <p class="error" id="add-error"></p>
      </div>
    </form>
    <p class="hint" data-i18n="compare.note"></p>
  </main>
  <script src="i18n.js"></script>
  <script src="mine.js"></script>
  <script src="compare.js"></script>
</body>
</html>
