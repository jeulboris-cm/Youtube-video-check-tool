<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Idea Check · Owner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">Idea Check</span>
    </a>
    <button type="button" class="link-button" id="logout" hidden>Log out</button>
  </header>

  <main class="container admin">
    <form id="login" class="card form-card login-card" novalidate>
      <h1>Owner page</h1>
      <p class="hint">Only for the owner of Idea Check.</p>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="error" id="login-error"></p>
      </div>
      <button type="submit" class="primary" id="login-submit">Open</button>
    </form>

    <div id="dashboard" hidden>
      <p class="eyebrow">Owner page</p>
      <h1>All checks</h1>

      <div class="tiles" id="tiles"></div>
      <p class="meta" id="accuracy"></p>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search title, idea, channel or email" aria-label="Search checks">
        <button type="button" class="secondary" id="download">Download spreadsheet (CSV)</button>
      </div>

      <p class="meta" id="count"></p>
      <ol id="checks" class="checks"></ol>
    </div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
