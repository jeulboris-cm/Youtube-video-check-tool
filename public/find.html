<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find your report · Idea Check</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Idea Check
    </a>
    <a class="header-link" href="/">Check an idea</a>
  </header>

  <main class="container">
    <form id="find-form" class="card form-card login-card" novalidate>
      <h1>Lost your report link?</h1>
      <p class="hint">Enter the email address you gave on the form. We will email you the links to all your reports.</p>
      <div class="field">
        <label for="email">Your email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required placeholder="you@example.com">
        <p class="error" id="email-error"></p>
      </div>
      <button type="submit" class="primary" id="find-submit">Email me my links</button>
      <p class="form-status" id="find-status" role="status"></p>
      <p class="hint">Didn't give an email on the form? Then we can't send the link. Contact the person who invited you to Idea Check and they can find your report for you.</p>
    </form>
  </main>
  <script src="find.js"></script>
</body>
</html>
